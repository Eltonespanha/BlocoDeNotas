<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pad Colaborativo</title>
  <style>
    :root {
      --bg-main: #1e1e1e;
      --text-main: #d4d4d4;
      --bg-bar: #252526;
      --border-color: #3c3c3c;
      --accent-color: #4ec9b0;
      --status-saving: #ce9178;
      --status-saved: #6a9955;
      --button-bg: #333333;
      --button-hover: #444444;
      --button-text: #ffffff;
    }

    body.light-theme {
      --bg-main: #f8f9fa;
      --text-main: #212529;
      --bg-bar: #e9ecef;
      --border-color: #dee2e6;
      --accent-color: #0d6efd;
      --status-saving: #d97706;
      --status-saved: #16a34a;
      --button-bg: #ffffff;
      --button-hover: #e2e8f0;
      --button-text: #212529;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* Ajuste dinâmico para telas de celular */
      overflow: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Cabeçalho de Controle */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 15px;
      background-color: var(--bg-bar);
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
      flex-shrink: 0;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      background-color: var(--button-bg);
      color: var(--button-text);
      border: 1px solid var(--border-color);
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn:hover {
      background-color: var(--button-hover);
    }

    .url-info { color: var(--accent-color); font-weight: bold; }
    .status { font-size: 12px; opacity: 0.8; transition: color 0.2s; white-space: nowrap; }
    .status.saving { color: var(--status-saving); }
    .status.saved { color: var(--status-saved); }

    /* Área de Texto */
    .editor-container {
      flex: 1;
      display: flex;
      padding: 10px;
      min-height: 0;
    }

    textarea {
      flex: 1;
      width: 100%;
      height: 100%;
      background: transparent;
      color: var(--text-main);
      border: none;
      outline: none;
      padding: 15px;
      font-size: 16px;
      line-height: 1.6;
      resize: none;
      transition: font-family 0.2s, font-style 0.2s, letter-spacing 0.2s;
    }

    /* Variações de Estilo de Escrita */
    textarea.font-classic {
      font-family: 'Courier New', Courier, monospace;
      font-style: normal;
      letter-spacing: normal;
    }

    textarea.font-cursive {
      font-family: 'Segoe Print', 'Caveat', 'Comic Sans MS', cursive;
      font-size: 17px;
      letter-spacing: 0.5px;
    }

    textarea.font-code-italic {
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-style: italic;
      letter-spacing: 0.3px;
    }

    /* Rodapé 1: Ticker de Cotações */
    .bottom-ticker-bar {
      height: 32px;
      background-color: var(--bg-bar);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      font-size: 13px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .ticker-wrapper {
      display: inline-flex;
      white-space: nowrap;
      animation: marquee 35s linear infinite;
    }

    .ticker-wrapper:hover {
      animation-play-state: paused;
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 25px;
    }

    .ticker-up { color: #00ff66; }
    .ticker-down { color: #ff3344; }
    body.light-theme .ticker-up { color: #15803d; }
    body.light-theme .ticker-down { color: #dc2626; }

    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }

    /* Rodapé 2: Informações de Contagem e Marca d'Água */
    footer {
      height: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      background-color: var(--bg-bar);
      border-top: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-main);
      opacity: 0.9;
      flex-shrink: 0;
    }

    .watermark {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #569cd6, #4ec9b0, #ce9178, #569cd6);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 6s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body>

  <!-- Cabeçalho de Navegação e Controles -->
  <header>
    <div>Nota atual: <span id="note-name" class="url-info">#home</span></div>
    <div class="controls">
      <button id="theme-btn" class="btn">☀️ Tema Claro</button>
      <button id="font-btn" class="btn">✍️ Fonte: Monospace</button>
      <div id="status" class="status">Conectando...</div>
    </div>
  </header>

  <!-- Editor de Texto Principal -->
  <div class="editor-container">
    <textarea id="pad" class="font-classic" placeholder="Digite seu texto aqui..."></textarea>
  </div>

  <!-- Rodapé 1: Ticker de Cotações -->
  <div class="bottom-ticker-bar">
    <div class="ticker-wrapper" id="ticker-content">
      <div class="ticker-item">Carregando cotações...</div>
    </div>
  </div>

  <!-- Rodapé 2: Informações de Contagem e Marca d'Água -->
  <footer>
    <div id="counter">0 caracteres | 0 palavras</div>
    <div class="watermark">by Elton Ferreira</div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA7w8j5QQlJWcNbUQnHRNBbPEUqX0rG94s",
      authDomain: "meublocodenotas-5c5c8.firebaseapp.com",
      databaseURL: "https://meublocodenotas-5c5c8-default-rtdb.firebaseio.com",
      projectId: "meublocodenotas-5c5c8",
      storageBucket: "meublocodenotas-5c5c8.firebasestorage.app",
      messagingSenderId: "1075640939913",
      appId: "1:1075640939913:web:8457257fcb17df77175d58",
      measurementId: "G-93Y0JKZZC7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const pad = document.getElementById("pad");
    const statusEl = document.getElementById("status");
    const noteNameEl = document.getElementById("note-name");
    const counterEl = document.getElementById("counter");
    const themeBtn = document.getElementById("theme-btn");
    const fontBtn = document.getElementById("font-btn");
    const tickerContainer = document.getElementById("ticker-content");

    // --- LÓGICA DE ROTAS E NOTAS ---
    function getNoteId() {
      const savedNote = sessionStorage.getItem('gh_pages_note');
      if (savedNote) {
        sessionStorage.removeItem('gh_pages_note');
        history.replaceState(null, '', '/BlocoDeNotasClon/' + savedNote);
        return savedNote;
      }

      const path = window.location.pathname.split('/').filter(Boolean);
      const pathNote = path.length > 1 ? path.slice(1).join('/') : '';
      const hashNote = window.location.hash.replace("#", "").trim();

      return hashNote || pathNote || "home";
    }

    let currentNoteId = getNoteId();
    noteNameEl.textContent = `#${currentNoteId}`;
    let noteRef = ref(db, 'notes/' + currentNoteId);

    const localKey = `dontpad_cache_${currentNoteId}`;
    const cachedContent = localStorage.getItem(localKey);
    if (cachedContent !== null) {
      pad.value = cachedContent;
      updateCounters();
    }

    let isUserTyping = false;
    let debounceTimer = null;
    let unsubscribe = null;

    function listenToDatabase() {
      if (unsubscribe) unsubscribe();
      
      unsubscribe = onValue(noteRef, (snapshot) => {
        if (!isUserTyping) {
          const val = snapshot.val() || "";
          pad.value = val;
          localStorage.setItem(localKey, val);
          updateCounters();
          setStatus("Sincronizado", "saved");
        }
      });
    }

    listenToDatabase();

    window.addEventListener("hashchange", () => {
      currentNoteId = getNoteId();
      noteNameEl.textContent = `#${currentNoteId}`;
      noteRef = ref(db, 'notes/' + currentNoteId);
      isUserTyping = false;
      setStatus("Carregando...", "");
      listenToDatabase();
    });

    pad.addEventListener("input", () => {
      isUserTyping = true;
      setStatus("Salvando...", "saving");
      updateCounters();
      
      localStorage.setItem(localKey, pad.value);

      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        set(noteRef, pad.value)
          .then(() => {
            setStatus("Salvo", "saved");
            isUserTyping = false;
          })
          .catch((err) => {
            console.error("Erro ao salvar:", err);
            setStatus("Erro de salvamento", "saving");
            isUserTyping = false;
          });
      }, 350);
    });

    function setStatus(text, className) {
      statusEl.textContent = text;
      statusEl.className = `status ${className}`;
    }

    function updateCounters() {
      const text = pad.value;
      const chars = text.length;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      counterEl.textContent = `${chars} caracteres | ${words} palavras`;
    }

    // --- CONTROLE DE TEMA ---
    themeBtn.addEventListener("click", () => {
      document.body.classList.toggle("light-theme");
      const isLight = document.body.classList.contains("light-theme");
      themeBtn.textContent = isLight ? "🌙 Tema Escuro" : "☀️ Tema Claro";
      localStorage.setItem("theme_preference", isLight ? "light" : "dark");
    });

    if (localStorage.getItem("theme_preference") === "light") {
      document.body.classList.add("light-theme");
      themeBtn.textContent = "🌙 Tema Escuro";
    }

    // --- CONTROLE DE FONTE ---
    const fontStyles = [
      { class: "font-classic", label: "✍️ Fonte: Monospace" },
      { class: "font-cursive", label: "✍️ Fonte: Manuscrita" },
      { class: "font-code-italic", label: "✍️ Fonte: Itálico Code" }
    ];

    let currentFontIndex = parseInt(localStorage.getItem("font_index") || "0", 10);

    function applyFontIndex(index) {
      pad.className = fontStyles[index].class;
      fontBtn.textContent = fontStyles[index].label;
      localStorage.setItem("font_index", index.toString());
    }

    fontBtn.addEventListener("click", () => {
      currentFontIndex = (currentFontIndex + 1) % fontStyles.length;
      applyFontIndex(currentFontIndex);
    });

    applyFontIndex(currentFontIndex);

    // --- TICKER DE COTAÇÕES TOLERANTE A FALHAS DE REDE MÓVEL ---
    async function fetchQuotes() {
      const items = [];

      // Ações B3 (sempre presentes)
      const stocks = [
        { symbol: "PETR4", price: 38.45, pct: 1.25 },
        { symbol: "ABEV3", price: 14.20, pct: -0.42 },
        { symbol: "VALE3", price: 62.10, pct: 0.85 },
        { symbol: "ITUB4", price: 34.80, pct: -0.15 }
      ];

      stocks.forEach(s => {
        items.push(formatTickerItem(s.symbol, s.price.toFixed(2), s.pct));
      });

      // Tenta buscar Moedas (AwesomeAPI)
      try {
        const forexRes = await fetch("https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-USD").then(r => r.json());
        if (forexRes?.USDBRL) {
          items.push(formatTickerItem("USD/BRL", parseFloat(forexRes.USDBRL.bid).toFixed(2), parseFloat(forexRes.USDBRL.pctChange)));
        }
        if (forexRes?.EURUSD) {
          items.push(formatTickerItem("EUR/USD", parseFloat(forexRes.EURUSD.bid).toFixed(4), parseFloat(forexRes.EURUSD.pctChange)));
        }
      } catch (e) {
        console.warn("Moedas indisponíveis no momento");
      }

      // Tenta buscar Criptomoedas (Binance)
      try {
        const cryptoRes = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbols=[%22BTCUSDT%22,%22ETHUSDT%22]").then(r => r.json());
        if (Array.isArray(cryptoRes)) {
          cryptoRes.forEach(c => {
            const name = c.symbol === "BTCUSDT" ? "BTC/USD" : "ETH/USD";
            items.push(formatTickerItem(name, parseFloat(c.lastPrice).toLocaleString('en-US', {minimumFractionDigits: 2}), parseFloat(c.priceChangePercent)));
          });
        }
      } catch (e) {
        console.warn("Criptos indisponíveis no 4G/rede móvel");
      }

      // Renderiza duplicando para efeito infinito de rolagem
      if (items.length > 0) {
        tickerContainer.innerHTML = [...items, ...items].join("");
      }
    }

    function formatTickerItem(name, price, pct) {
      const isUp = pct >= 0;
      const arrow = isUp ? "▲" : "▼";
      const cssClass = isUp ? "ticker-up" : "ticker-down";
      const sign = isUp ? "+" : "";
      return `
        <div class="ticker-item">
          <span>${name}</span>
          <span>${price}</span>
          <span class="${cssClass}">${arrow} ${sign}${pct.toFixed(2)}%</span>
        </div>
      `;
    }

    fetchQuotes();
    setInterval(fetchQuotes, 60000);
  </script>
</body>
</html>
